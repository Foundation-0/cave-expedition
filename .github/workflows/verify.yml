name: verify

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  check003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I -B verification/checks/check_003_seam01_ropt.py
      - run: python3 -I -O -B verification/checks/check_003_seam01_ropt.py
      - run: python3 -I -B -W error verification/checks/check_003_seam01_ropt.py
